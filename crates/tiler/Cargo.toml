[package]
name = "tiler"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
arrow-array = { version = "60.0.0", optional = true }
arrow-schema = { version = "60", optional = true }
csv = { version = "1.4.0", optional = true }
encoding_rs = { version = "0.8.42", optional = true }
encoding_rs_io = { version = "0.1.8", optional = true }
flate2 = "1.1.10"
h3o = "0.11.0"
parquet = { version = "60.0.0", optional = true, default-features = false, features = ["arrow", "snap", "zstd", "lz4", "flate2", "flate2-rust_backend"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bin]]
name = "tiler"
path = "src/main.rs"
required-features = ["files"]

[features]
default = ["files"]
# Leitura de CSV/Parquet do disco (servidor e CLI). Sem ela, o núcleo compila para WebAssembly.
files = ["dep:arrow-array", "dep:arrow-schema", "dep:csv", "dep:encoding_rs", "dep:encoding_rs_io", "dep:parquet"]
