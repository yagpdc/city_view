# Publica o app no GitHub Pages a cada push na main (https://yagpdc.github.io/city_view/).
# Os arquivos grandes de mapa ficam no Cloudflare R2 (VITE_DATA_URL); os dados dos usuários ficam no navegador deles.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter @cityview/web build
        env:
          CITYVIEW_BASE: /city_view/
          VITE_DATA_URL: https://pub-edd6ace9283449c1a62ccaeae01d3350.r2.dev
          # Opcional: token de CLIENTE do Mapillary (fotos de rua), em Settings > Secrets > Actions.
          VITE_MAPILLARY_TOKEN: ${{ secrets.VITE_MAPILLARY_TOKEN }}
      # Links diretos para subpáginas caem no app (o GitHub Pages responde 404.html).
      - run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
